[package]
name = "chud-app"
description = "Chud Input Recorder desktop application"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "chud_app"
crate-type = ["rlib"]

[[bin]]
name = "chud-input-recorder"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.7.6", features = [] }

[dependencies]
chud-core = { path = "../../crates/chud-core" }
chud-platform = { path = "../../crates/chud-platform" }
chud-engine = { path = "../../crates/chud-engine" }
tauri = { version = "2.12.7", features = ["tray-icon", "image-png"] }
tauri-plugin-dialog = "2.8.4"
tauri-plugin-opener = "2.7.3"
tauri-plugin-single-instance = "2.5.5"
serde_json = "1.0.154"
log = "0.4.35"
parking_lot = "0.13.0"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "bmp", "gif", "webp"] }
crossbeam-channel = "0.5.17"
dirs = "7.0.0"
serde = { version = "1.0.229", features = ["derive"] }
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
tauri-plugin-updater = "2.14.1"
