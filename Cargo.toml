[workspace]
resolver = "3"
members = ["crates/*", "app/src-tauri"]

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/BigFatDeuce/Chud-Input-Recorder"
authors = ["Chud Input Recorder contributors"]

[profile.release]
lto = "thin"
codegen-units = 1
opt-level = 3
strip = "debuginfo"

[profile.dev.package."*"]
opt-level = 2

# Image search scans whole screens: keep it fast in development builds too.
[profile.dev.package.chud-core]
opt-level = 3
