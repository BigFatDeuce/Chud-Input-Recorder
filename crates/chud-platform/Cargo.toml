[package]
name = "chud-platform"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
chud-core = { path = "../chud-core" }
crossbeam-channel = "0.5.17"
log = "0.4.35"
parking_lot = "0.13.0"
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.21"

[target."cfg(windows)".dependencies]
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Input", "Win32_System_Threading", "Win32_System_LibraryLoader", "Win32_Graphics_Gdi", "Win32_UI_HiDpi", "Win32_UI_Accessibility", "Win32_Security", "Win32_Media", "Win32_System_SystemInformation", "Win32_Devices_HumanInterfaceDevice", "Win32_System_Diagnostics_Debug", "Win32_UI_Input_XboxController", "Foundation", "Foundation_Collections", "Graphics_Imaging", "Media_Ocr", "Security_Cryptography", "Storage_Streams"] }
vigem-client = "0.1.4"

[target.'cfg(target_os = "linux")'.dependencies]
evdev = "0.13.2"
libc = "0.2.191"
x11rb = { version = "0.14.0", features = ["randr", "xtest"] }
